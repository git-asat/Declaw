name: Build & Release Declaw

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build DeclawService (self-contained)
      run: |
        dotnet publish src/service/Service.csproj `
          -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishTrimmed=true `
          -p:TrimMode=partial `
          -o publish

    - name: Build DeclawControl (self-contained)
      run: |
        dotnet publish src/ui/UI.csproj `
          -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishTrimmed=true `
          -p:TrimMode=partial `
          -o publish

    - name: Copy driver sources and config
      run: |
        mkdir publish\driver
        Copy-Item src\driver\Declaw.h      publish\driver\
        Copy-Item src\driver\Declaw.c      publish\driver\
        Copy-Item src\driver\DeclawComm.c  publish\driver\
        Copy-Item src\driver\Declaw.inf    publish\driver\
        Copy-Item src\driver\Declaw.vcxproj publish\driver\
        Copy-Item src\driver\README.md       publish\driver\
        Copy-Item src\service\appsettings.json publish\
        Copy-Item README.md                  publish\

    - name: Create release archive
      run: |
        Compress-Archive -Path publish\* -DestinationPath Declaw-win-x64.zip

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Declaw-win-x64
        path: Declaw-win-x64.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: Declaw-win-x64.zip
        generate_release_notes: true
